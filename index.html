<!-- ส่วนเลือกชั้นเรียน -->
<div class="mb-3">
  <label for="grade" class="form-label">ชั้นเรียน</label>
  <select class="form-select" id="grade" onchange="updateRoomOptions()" required>
    <option value="" selected disabled>-- เลือกชั้นเรียน --</option>
    <option value="ม.1">มัธยมศึกษาปีที่ 1</option>
    <option value="ม.2">มัธยมศึกษาปีที่ 2</option>
    <option value="ม.3">มัธยมศึกษาปีที่ 3</option>
    <option value="ม.4">มัธยมศึกษาปีที่ 4</option>
    <option value="ม.5">มัธยมศึกษาปีที่ 5</option>
    <option value="ม.6">มัธยมศึกษาปีที่ 6</option>
  </select>
</div>

<!-- ส่วนเลือกห้องเรียน -->
<div class="mb-3">
  <label for="room" class="form-label">ห้องเรียน</label>
  <select class="form-select" id="room" required>
    <option value="" selected disabled>-- เลือกห้องเรียน --</option>
  </select>
</div>

<script>
function updateRoomOptions() {
  const gradeSelect = document.getElementById('grade');
  const roomSelect = document.getElementById('room');
  const selectedGrade = gradeSelect.value;

  // ล้างตัวเลือกห้องเดิม
  roomSelect.innerHTML = '<option value="" selected disabled>-- เลือกห้องเรียน --</option>';

  // กำหนดจำนวนห้องตามระดับชั้น
  let maxRooms = 0;
  if (['ม.1', 'ม.2', 'ม.3'].includes(selectedGrade)) {
    maxRooms = 4; // ม.1-3 มี 4 ห้อง
  } else if (['ม.4', 'ม.5', 'ม.6'].includes(selectedGrade)) {
    maxRooms = 3; // ม.4-6 มี 3 ห้อง
  }

  // สร้างตัวเลือกห้อง
  for (let i = 1; i <= maxRooms; i++) {
    const option = document.createElement('option');
    option.value = i;
    option.textContent = `ห้อง ${i}`;
    roomSelect.appendChild(option);
  }
}
</script>
